<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - UTHM</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      background: linear-gradient(to bottom right, #f4f7fb, #e2e7ef);
      color: #222;
      min-height: 100vh;
    }

    .container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Logo */
    .logo {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background-color: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .logo img {
      width: 250px;
    }

    /* Navigation */
    .navigation {
      display: flex;
      justify-content: center;
      background-color: #1d3557;
      padding: 15px 0;
      gap: 40px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }

    .navigation a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s;
    }

    .navigation a:hover {
      color: #ffcc00;
      transform: scale(1.05);
    }

    /* Content */
    .content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }

    .contact-box {
      background-color: white;
      padding: 30px 50px;
      border-radius: 12px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 100%;
    }

    .contact-box h2 {
      text-align: center;
      color: #1d3557;
      margin-bottom: 20px;
    }

    .contact-info {
      line-height: 2;
      font-size: 16px;
    }

    .contact-info strong {
      color: #1d3557;
    }

    /* Footer */
    .footer {
      background-color: #1d3557;
      color: white;
      text-align: center;
      padding: 15px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="4e732ced3463d06de0ca9a15b6153677.png" alt="UTHM Logo">
    </div>

    <div class="navigation">
      <a href="lab3.html">Home</a>
      <a href="contact_me.html">Contact Me</a>
    </div>

    <div class="content">
      <div class="contact-box">
        <h2>Contact Information</h2>
        <div class="contact-info">
          <p><strong>Name:</strong> Alimi Irfan</p>
          <p><strong>Contact Number:</strong> +60 13-767 7798</p>
          <p><strong>Email:</strong> ci230023@student.uthm.edu.my</p>
        </div>
      </div>
    </div>

    <div class="footer">
      &copy; 2025 Universiti Tun Hussein Onn Malaysia | Designed by Ariffin
    </div>
  </div>
</body>
</html>
